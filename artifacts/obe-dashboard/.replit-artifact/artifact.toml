kind = "web"
previewPath = "/"
title = "OBE Attainment Dashboard"
version = "1.0.0"
id = "artifacts/obe-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21381

[services.development]
run = "pnpm --filter @workspace/obe-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/obe-dashboard", "run", "build" ]
publicDir = "artifacts/obe-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21381"
BASE_PATH = "/"
