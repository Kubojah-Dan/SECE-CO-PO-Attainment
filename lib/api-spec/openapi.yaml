openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CO-PO/PSO Attainment Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: users
  - name: departments
  - name: regulations
  - name: subjects
  - name: students
  - name: courses
  - name: outcomes
  - name: mappings
  - name: marks
  - name: attainment
  - name: uploads
  - name: reports
  - name: dashboard

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInput"
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Invalidate refresh token
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ── USERS ───────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── DEPARTMENTS ─────────────────────────────────────────────────────────────
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    get:
      operationId: getDepartment
      tags: [departments]
      summary: Get department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}/stats:
    get:
      operationId: getDepartmentStats
      tags: [departments]
      summary: Department attainment statistics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentStats"

  # ── REGULATIONS ─────────────────────────────────────────────────────────────
  /regulations:
    get:
      operationId: listRegulations
      tags: [regulations]
      summary: List regulations
      parameters:
        - name: departmentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Regulation"
    post:
      operationId: createRegulation
      tags: [regulations]
      summary: Create regulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegulationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Regulation"

  # ── SUBJECTS ────────────────────────────────────────────────────────────────
  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List subjects
      parameters:
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: regulationId
          in: query
          schema:
            type: integer
        - name: semester
          in: query
          schema:
            type: integer
        - name: academicYear
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
    post:
      operationId: createSubject
      tags: [subjects]
      summary: Create subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"

  /subjects/{id}:
    get:
      operationId: getSubject
      tags: [subjects]
      summary: Get subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
    patch:
      operationId: updateSubject
      tags: [subjects]
      summary: Update subject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"

  # ── COURSE OUTCOMES ─────────────────────────────────────────────────────────
  /subjects/{subjectId}/cos:
    get:
      operationId: listCOs
      tags: [outcomes]
      summary: List course outcomes for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of COs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseOutcome"
    post:
      operationId: createCO
      tags: [outcomes]
      summary: Create course outcome
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseOutcomeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseOutcome"

  /cos/{id}:
    patch:
      operationId: updateCO
      tags: [outcomes]
      summary: Update course outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseOutcomeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseOutcome"
    delete:
      operationId: deleteCO
      tags: [outcomes]
      summary: Delete course outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── PROGRAM OUTCOMES ────────────────────────────────────────────────────────
  /departments/{departmentId}/pos:
    get:
      operationId: listPOs
      tags: [outcomes]
      summary: List program outcomes for a department
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Program outcomes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramOutcome"
    post:
      operationId: createPO
      tags: [outcomes]
      summary: Create program outcome
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramOutcomeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramOutcome"

  /departments/{departmentId}/psos:
    get:
      operationId: listPSOs
      tags: [outcomes]
      summary: List program specific outcomes
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PSOs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSpecificOutcome"
    post:
      operationId: createPSO
      tags: [outcomes]
      summary: Create PSO
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramSpecificOutcomeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramSpecificOutcome"

  # ── CO-PO/PSO MAPPINGS ──────────────────────────────────────────────────────
  /subjects/{subjectId}/mappings:
    get:
      operationId: listMappings
      tags: [mappings]
      summary: List CO-PO/PSO mappings for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mapping"
    post:
      operationId: createMapping
      tags: [mappings]
      summary: Create CO-PO/PSO mapping
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapping"

  /mappings/{id}:
    patch:
      operationId: updateMapping
      tags: [mappings]
      summary: Update mapping correlation level
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MappingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapping"
    delete:
      operationId: deleteMapping
      tags: [mappings]
      summary: Delete mapping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /mappings/{id}/approve:
    patch:
      operationId: approveMapping
      tags: [mappings]
      summary: HOD approves a mapping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mapping"

  # ── STUDENTS ────────────────────────────────────────────────────────────────
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students
      parameters:
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: regulationId
          in: query
          schema:
            type: integer
        - name: semester
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentListResponse"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  # ── MARKS ───────────────────────────────────────────────────────────────────
  /subjects/{subjectId}/marks:
    get:
      operationId: listMarks
      tags: [marks]
      summary: Get marks for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marks data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentMark"
    post:
      operationId: createMark
      tags: [marks]
      summary: Insert or update a mark entry
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentMarkInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentMark"

  # ── UPLOADS ─────────────────────────────────────────────────────────────────
  /uploads/marks:
    post:
      operationId: uploadMarksExcel
      tags: [uploads]
      summary: Upload Excel file for bulk mark import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MarksUploadInput"
      responses:
        "202":
          description: Upload queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadJob"

  /uploads/{jobId}/status:
    get:
      operationId: getUploadStatus
      tags: [uploads]
      summary: Get upload job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadJob"

  /uploads/history:
    get:
      operationId: listUploadHistory
      tags: [uploads]
      summary: List recent upload jobs
      parameters:
        - name: subjectId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Upload history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadJob"

  # ── ATTAINMENT ──────────────────────────────────────────────────────────────
  /attainment/subjects/{subjectId}/co:
    get:
      operationId: getCOAttainment
      tags: [attainment]
      summary: Get CO attainment for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: CO attainment results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/COAttainment"

  /attainment/subjects/{subjectId}/calculate:
    post:
      operationId: calculateAttainment
      tags: [attainment]
      summary: Trigger attainment calculation for a subject
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttainmentCalcInput"
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttainmentResult"

  /attainment/departments/{departmentId}/po:
    get:
      operationId: getPOAttainment
      tags: [attainment]
      summary: Get PO attainment for a department
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PO attainment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/POAttainment"

  /attainment/departments/{departmentId}/pso:
    get:
      operationId: getPSOAttainment
      tags: [attainment]
      summary: Get PSO attainment for a department
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PSO attainment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PSOAttainment"

  /attainment/subjects/{subjectId}/indirect:
    get:
      operationId: getIndirectAttainment
      tags: [attainment]
      summary: Get indirect attainment data (surveys)
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Indirect attainment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndirectAttainment"
    post:
      operationId: saveIndirectAttainment
      tags: [attainment]
      summary: Save indirect attainment data
      parameters:
        - name: subjectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndirectAttainmentInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndirectAttainment"

  # ── DASHBOARD / ANALYTICS ───────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Institution-wide dashboard summary
      parameters:
        - name: academicYear
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/co-trends:
    get:
      operationId: getCOTrends
      tags: [dashboard]
      summary: CO attainment trends over time
      parameters:
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: subjectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/COTrend"

  /dashboard/weak-cos:
    get:
      operationId: getWeakCOs
      tags: [dashboard]
      summary: Detect COs below attainment threshold
      parameters:
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: threshold
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Weak COs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeakCO"

  /dashboard/department-comparison:
    get:
      operationId: getDepartmentComparison
      tags: [dashboard]
      summary: Compare attainment across departments
      parameters:
        - name: academicYear
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentComparison"

  /dashboard/faculty-progress:
    get:
      operationId: getFacultyProgress
      tags: [dashboard]
      summary: Faculty-wise progress tracking
      parameters:
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: academicYear
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Faculty progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FacultyProgress"

  # ── REPORTS ─────────────────────────────────────────────────────────────────
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated reports
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: departmentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Reports list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /reports/generate:
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a new report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "202":
          description: Report generation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get report details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{id}/download:
    get:
      operationId: downloadReport
      tags: [reports]
      summary: Download report as PDF or Excel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ── AUDIT LOGS ──────────────────────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [users]
      summary: List audit logs
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── AUTH ──────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, HOD, FACULTY, IQAC]
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]

    # ── USERS ─────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, role, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, HOD, FACULTY, IQAC]
        isActive:
          type: boolean
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, password, role]
      properties:
